<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="Sistema de gestión de servicios SaaS - NelSystems Dashboard">
  <meta name="theme-color" content="#FDB022">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="NelSystems">
  
  <title>NelSystems Dashboard</title>
  
  <!-- PWA Manifest -->
  <link rel="manifest" href="./manifest.json">
  
  <!-- Icons -->
  <link rel="icon" type="image/png" sizes="512x512" href="./assets/images/logo-512.png">
  <link rel="apple-touch-icon" href="./assets/images/logo-512.png">
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  
  <!-- Styles -->
  <link rel="stylesheet" href="./styles/main.css">
</head>
<body>
  <!-- App Container -->
  <div id="app">
    <!-- Splash Screen / Loading -->
    <div id="splash-screen" class="splash-screen">
      <div class="splash-content">
        <img src="./assets/images/logo-512.png" alt="NelSystems" class="splash-logo">
        <div class="splash-loader"></div>
      </div>
    </div>

    <!-- Login View -->
    <div id="login-view" class="view hidden">
      <div class="login-container">
        <div class="login-card">
          <div class="login-header">
            <img src="./assets/images/logo-512.png" alt="NelSystems" class="login-logo">
            <h1>NelSystems Dashboard</h1>
            <p>Sistema de gestión de servicios SaaS</p>
          </div>
          
          <form id="login-form" class="login-form">
            <div class="form-group">
              <label for="login-email">Email</label>
              <input 
                type="email" 
                id="login-email" 
                name="email" 
                required
                autocomplete="email"
                placeholder="admin@nelsystems.com"
              >
            </div>
            
            <div class="form-group">
              <label for="login-password">Contraseña</label>
              <input 
                type="password" 
                id="login-password" 
                name="password" 
                required
                autocomplete="current-password"
                placeholder="••••••••"
              >
            </div>
            
            <button type="submit" class="btn btn-primary btn-block">
              Iniciar Sesión
            </button>
          </form>
          
          <div class="login-footer">
            <p class="text-muted">v1.0.0 • 2026</p>
          </div>
        </div>
      </div>
    </div>

    <!-- Main Dashboard View -->
    <div id="dashboard-view" class="view hidden">
      <!-- Sidebar -->
      <aside id="sidebar" class="sidebar">
        <div class="sidebar-header">
          <img src="./assets/images/logo-512.png" alt="NelSystems" class="sidebar-logo">
          <span class="sidebar-title">NelSystems</span>
        </div>
        
        <nav class="sidebar-nav">
          <a href="#/dashboard" class="nav-item" data-route="dashboard">
            <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="3" y="3" width="7" height="7"></rect>
              <rect x="14" y="3" width="7" height="7"></rect>
              <rect x="14" y="14" width="7" height="7"></rect>
              <rect x="3" y="14" width="7" height="7"></rect>
            </svg>
            <span>Dashboard</span>
          </a>
          
          <a href="#/clients" class="nav-item" data-route="clients">
            <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
              <circle cx="9" cy="7" r="4"></circle>
              <path d="M23 21v-2a4 4 0 0 0-3-3.87"></path>
              <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
            </svg>
            <span>Clientes</span>
          </a>
          
          <a href="#/projects" class="nav-item" data-route="projects">
            <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path>
            </svg>
            <span>Proyectos</span>
          </a>
          
          <a href="#/services" class="nav-item" data-route="services">
            <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="12" cy="12" r="10"></circle>
              <circle cx="12" cy="12" r="6"></circle>
              <circle cx="12" cy="12" r="2"></circle>
            </svg>
            <span>Servicios</span>
          </a>
          
          <a href="#/domains" class="nav-item" data-route="domains">
            <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="12" cy="12" r="10"></circle>
              <path d="M2 12h20"></path>
              <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path>
            </svg>
            <span>Dominios</span>
          </a>
          
          <a href="#/hosting" class="nav-item" data-route="hosting">
            <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="2" y="2" width="20" height="8" rx="2" ry="2"></rect>
              <rect x="2" y="14" width="20" height="8" rx="2" ry="2"></rect>
              <line x1="6" y1="6" x2="6.01" y2="6"></line>
              <line x1="6" y1="18" x2="6.01" y2="18"></line>
            </svg>
            <span>Hosting</span>
          </a>
          
          <a href="#/licenses" class="nav-item" data-route="licenses">
            <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
              <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
            </svg>
            <span>Licencias</span>
          </a>
          
          <a href="#/tickets" class="nav-item" data-route="tickets">
            <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
              <polyline points="14 2 14 8 20 8"></polyline>
              <line x1="12" y1="18" x2="12" y2="12"></line>
              <line x1="9" y1="15" x2="15" y2="15"></line>
            </svg>
            <span>Tickets</span>
          </a>
          
          <a href="#/payments" class="nav-item" data-route="payments">
            <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="1" y="4" width="22" height="16" rx="2" ry="2"></rect>
              <line x1="1" y1="10" x2="23" y2="10"></line>
            </svg>
            <span>Pagos</span>
          </a>
        </nav>
        
        <div class="sidebar-footer">
          <div class="user-menu">
            <div class="user-avatar" id="user-avatar">A</div>
            <div class="user-info">
              <div class="user-name" id="user-name">Admin</div>
              <div class="user-email" id="user-email">admin@nelsystems.com</div>
            </div>
          </div>
          <button class="btn-icon" id="logout-btn" title="Cerrar sesión">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
              <polyline points="16 17 21 12 16 7"></polyline>
              <line x1="21" y1="12" x2="9" y2="12"></line>
            </svg>
          </button>
        </div>
      </aside>

      <!-- Main Content -->
      <main class="main-content">
        <!-- Header -->
        <header class="main-header">
          <button class="btn-icon" id="sidebar-toggle">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <line x1="3" y1="12" x2="21" y2="12"></line>
              <line x1="3" y1="6" x2="21" y2="6"></line>
              <line x1="3" y1="18" x2="21" y2="18"></line>
            </svg>
          </button>
          
          <div class="header-title">
            <h1 id="page-title">Dashboard</h1>
            <p id="page-subtitle">Resumen general del sistema</p>
          </div>
          
          <div class="header-actions">
            <button class="btn-icon" id="theme-toggle" title="Cambiar tema">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
              </svg>
            </button>
            
            <button class="btn-icon" id="notifications-btn" title="Notificaciones">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
                <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
              </svg>
              <span class="badge" id="notifications-count">0</span>
            </button>
          </div>
        </header>

        <!-- Page Content -->
        <div id="page-content" class="page-content">
          <!-- Content will be loaded here dynamically -->
        </div>
      </main>
    </div>
  </div>

  <!-- Toast Container -->
  <div id="toast-container" class="toast-container"></div>

  <!-- Scripts -->
  <script type="module" src="./scripts/app.js"></script>
</body>
</html>
